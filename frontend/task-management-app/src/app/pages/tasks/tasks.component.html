<div class="container mt-5">

  <h1 class="mb-4">Task Management</h1>

  <!-- FORMULÁRIO -->
  <div class="card p-4 mb-4">
    <div class="mb-3">
      <label class="form-label">ID</label>
      <input type="number" class="form-control" [(ngModel)]="task.id" disabled>
    </div>

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" [(ngModel)]="task.title">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <input type="text" class="form-control" [(ngModel)]="task.description">
    </div>

    <div class="mb-3">
      <label class="form-label">Status</label>
      <input type="text" class="form-control" [(ngModel)]="task.status">
    </div>

    <button class="btn btn-primary" (click)="save()">

      {{ editing ? 'Update' : 'Save' }}

    </button>

    <button class="btn btn-secondary" (click)="cancel()">
      Cancel
    </button>

  </div>

  <!-- TABELA -->
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let task of tasks">
        <td>{{ task.id }}</td>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td>{{ task.status }}</td>

        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="edit(task)">
            Edit
          </button>

          <button class="btn btn-danger btn-sm" (click)="remove(task.id)">
            Delete
          </button>
        </td>

      </tr>
    </tbody>
  </table>
</div>
